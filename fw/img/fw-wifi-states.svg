        <path d="M480 220V170H370V122" marker-end="url(#af)" fill="none" stroke="rgb(28, 32, 25)" stroke-width="1.4px" stroke-dasharray="none" font-size="15.5px" font-weight="400" text-anchor="start" opacity="1" fill-opacity="1"></path><text x="362" y="160" text-anchor="end" fill="rgb(91, 100, 84)" stroke="none" stroke-width="1px" stroke-dasharray="none" font-size="11.5px" font-weight="400" opacity="1" fill-opacity="1" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif">сохранено или</text><text x="362" y="175" text-anchor="end" fill="rgb(91, 100, 84)" stroke="none" stroke-width="1px" stroke-dasharray="none" font-size="11.5px" font-weight="400" opacity="1" fill-opacity="1" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif">10 мин без действий</text>
      </svg>
