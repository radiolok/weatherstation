        <path d="M470 80H638" marker-end="url(#af)" fill="none" stroke="rgb(28, 32, 25)" stroke-width="1.4px" stroke-dasharray="none" font-size="15.5px" font-weight="400" text-anchor="start" opacity="1" fill-opacity="1"></path><text x="554" y="72" text-anchor="middle" fill="rgb(91, 100, 84)" stroke="none" stroke-width="1px" stroke-dasharray="none" font-size="11.5px" font-weight="400" opacity="1" fill-opacity="1" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif">IP получен</text>
        <path d="M640 104H472" marker-end="url(#af)" fill="none" stroke="rgb(28, 32, 25)" stroke-width="1.4px" stroke-dasharray="none" font-size="15.5px" font-weight="400" text-anchor="start" opacity="1" fill-opacity="1"></path><text x="554" y="122" text-anchor="middle" fill="rgb(91, 100, 84)" stroke="none" stroke-width="1px" stroke-dasharray="none" font-size="11.5px" font-weight="400" opacity="1" fill-opacity="1" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif">связь пропала</text>
