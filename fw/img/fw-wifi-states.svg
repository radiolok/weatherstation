<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 310" role="img" aria-label="Автомат состояний сети: старт ведёт в подключение STA при наличии конфигурации или в точку доступа без неё; подключение переходит в состояние в сети при получении IP и обратно при потере связи; удержание кнопки 5 секунд переводит в точку доступа; сохранение настроек или 10 минут бездействия возвращают в подключение" fill="rgb(0, 0, 0)" stroke="none" stroke-width="1px" stroke-dasharray="none" font-size="15.5px" font-weight="400" text-anchor="start" opacity="1" fill-opacity="1" xmlns="http://www.w3.org/2000/svg" width="1000" height="310"><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="rgb(28, 32, 25)"></path></marker></defs><rect x="0" y="0" width="1000" height="310" fill="#ffffff" rx="0"></rect>
        <rect x="20" y="100" width="140" height="56" rx="28" fill="rgb(228, 231, 221)" stroke="rgb(91, 100, 84)" stroke-width="1px" stroke-dasharray="none" font-size="15.5px" font-weight="400" text-anchor="start" opacity="1" fill-opacity="1"></rect><text x="90" y="124" text-anchor="middle" fill="rgb(28, 32, 25)" stroke="none" stroke-width="1px" stroke-dasharray="none" font-size="13.5px" font-weight="600" opacity="1" fill-opacity="1" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif">Старт</text><text x="90" y="141" text-anchor="middle" fill="rgb(91, 100, 84)" stroke="none" stroke-width="1px" stroke-dasharray="none" font-size="11.5px" font-weight="400" opacity="1" fill-opacity="1" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif">чтение NVS</text>
        <rect x="270" y="60" width="200" height="60" rx="8" fill="rgb(250, 251, 247)" stroke="rgb(28, 32, 25)" stroke-width="1.2px" stroke-dasharray="none" font-size="15.5px" font-weight="400" text-anchor="start" opacity="1" fill-opacity="1"></rect><text x="370" y="85" text-anchor="middle" fill="rgb(28, 32, 25)" stroke="none" stroke-width="1px" stroke-dasharray="none" font-size="13.5px" font-weight="600" opacity="1" fill-opacity="1" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif">Подключение</text><text x="370" y="103" text-anchor="middle" fill="rgb(91, 100, 84)" stroke="none" stroke-width="1px" stroke-dasharray="none" font-size="11.5px" font-weight="400" opacity="1" fill-opacity="1" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif">STA, backoff 1 → 60 с</text>
        <rect x="640" y="60" width="200" height="60" rx="8" fill="rgb(250, 251, 247)" stroke="rgb(46, 125, 50)" stroke-width="1.6px" stroke-dasharray="none" font-size="15.5px" font-weight="400" text-anchor="start" opacity="1" fill-opacity="1"></rect><text x="740" y="85" text-anchor="middle" fill="rgb(28, 32, 25)" stroke="none" stroke-width="1px" stroke-dasharray="none" font-size="13.5px" font-weight="600" opacity="1" fill-opacity="1" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif">В сети</text><text x="740" y="103" text-anchor="middle" fill="rgb(91, 100, 84)" stroke="none" stroke-width="1px" stroke-dasharray="none" font-size="11.5px" font-weight="400" opacity="1" fill-opacity="1" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif">MQTT, SNTP, mDNS · LED горит</text>
        <rect x="440" y="220" width="240" height="60" rx="8" fill="rgb(246, 233, 168)" stroke="rgb(138, 106, 0)" stroke-width="1.8px" stroke-dasharray="none" font-size="15.5px" font-weight="400" text-anchor="start" opacity="1" fill-opacity="1"></rect><text x="560" y="245" text-anchor="middle" fill="rgb(28, 32, 25)" stroke="none" stroke-width="1px" stroke-dasharray="none" font-size="13.5px" font-weight="600" opacity="1" fill-opacity="1" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif">Точка доступа</text><text x="560" y="263" text-anchor="middle" fill="rgb(91, 100, 84)" stroke="none" stroke-width="1px" stroke-dasharray="none" font-size="11.5px" font-weight="400" opacity="1" fill-opacity="1" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif">скан сетей, веб-настройка · LED мигает</text>

