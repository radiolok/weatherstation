# West manifest for the weatherstation firmware.
#
#   cd <workspace> && west init -l --mf fw/west.yml weatherstation && west update
#
# Only the modules the firmware needs are imported from Zephyr.
manifest:
  version: "1.2"
  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos
  projects:
    - name: zephyr
      remote: zephyrproject-rtos
      revision: v4.3.0
      import:
        name-allowlist:
          - hal_espressif
          - mbedtls
          - mcuboot
          - littlefs
          - zcbor          # MCUmgr (overlay-smp.conf)
