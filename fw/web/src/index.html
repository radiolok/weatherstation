<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Метеостанция</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <h1>Метеостанция</h1>
  <nav id="tabs" role="tablist">
    <button role="tab" data-tab="screens" aria-selected="true">Экраны</button>
    <button role="tab" data-tab="editor">Редактор</button>
    <button role="tab" data-tab="rule">Правило</button>
    <button role="tab" data-tab="sim">Симулятор</button>
    <button role="tab" data-tab="pictos">Пиктограммы</button>
    <button role="tab" data-tab="settings">Настройки</button>
    <button role="tab" data-tab="status">Состояние</button>
  </nav>
  <div class="savebar">
    <span id="dirty" hidden>есть несохранённые изменения</span>
    <button id="btn-save" class="primary">Сохранить</button>
  </div>
</header>

<main>
  <p id="msg" role="status" aria-live="polite"></p>

  <!-- Screens list -->
  <section id="tab-screens" class="tab">
    <div class="toolbar">
      <button id="btn-new">Создать</button>
      <button id="btn-dup">Дублировать</button>
      <button id="btn-del">Удалить</button>
      <button id="btn-default">Сделать экраном по умолчанию</button>
      <span class="sep"></span>
      <button id="btn-export">Экспорт</button>
      <label class="file">Импорт<input id="file-import" type="file" accept="application/json"></label>
      <button id="btn-rollback">Вернуть предыдущую версию</button>
      <button id="btn-factory">Сбросить к заводскому набору</button>
    </div>
    <ol id="screen-list" class="cards"></ol>
  </section>

  <!-- Screen editor -->
  <section id="tab-editor" class="tab" hidden>
    <div class="toolbar">
      <label>Экран <select id="ed-screen"></select></label>
      <label>Имя <input id="ed-name" size="16"></label>
      <label>id <input id="ed-id" size="10" pattern="[A-Za-z0-9_]+"></label>
      <label><input type="checkbox" id="ed-enabled"> включён</label>
      <button id="btn-undo" title="Ctrl+Z">Отменить</button>
      <button id="btn-redo" title="Ctrl+Y">Повторить</button>
      <button id="btn-preview">Показать на табло</button>
    </div>
    <div class="editor">
      <aside id="palette" aria-label="Элементы"></aside>
      <div class="canvas-wrap">
        <div id="ruler" class="ruler"></div>
        <canvas id="ed-canvas" width="816" height="88" tabindex="0" aria-label="Холст 102×11"></canvas>
        <div id="alt-bar" class="altbar"></div>
        <p class="hint">Перетащите элемент из палитры на холст. Стрелки двигают выбранный элемент на 1 точку, Delete удаляет.</p>
        <p id="ed-errors" class="errors"></p>
      </div>
      <aside id="props" aria-label="Свойства"></aside>
    </div>
  </section>

  <!-- Rule editor -->
  <section id="tab-rule" class="tab" hidden>
    <div class="toolbar"><label>Экран <select id="rule-screen"></select></label></div>
    <div id="rule-editor"></div>
    <p id="rule-summary" class="summary"></p>
  </section>

  <!-- Simulator -->
  <section id="tab-sim" class="tab" hidden>
    <div class="sim">
      <div id="sim-vars" class="vars-grid"></div>
      <div>
        <div class="toolbar">
          <label>Время <input id="sim-time" type="range" min="0" max="1439" step="10"></label>
          <output id="sim-time-out"></output>
          <button id="btn-sim-day">Прогон суток</button>
        </div>
        <canvas id="sim-canvas" width="816" height="88"></canvas>
        <p id="sim-reason" class="summary"></p>
        <div id="sim-day"></div>
      </div>
    </div>
  </section>

  <!-- Pictogram editor -->
  <section id="tab-pictos" class="tab" hidden>
    <div class="toolbar">
      <label>Пиктограмма <select id="pic-select"></select></label>
      <button id="pic-new">Новая</button>
      <button id="pic-copy">Копировать встроенную</button>
      <button id="pic-del">Удалить</button>
      <label>Имя <input id="pic-name" size="12" pattern="[a-z0-9_]+"></label>
      <label>Размер <select id="pic-size"><option>11</option><option>5</option></select></label>
    </div>
    <div class="pic">
      <canvas id="pic-grid" width="352" height="352"></canvas>
      <div class="pic-tools">
        <button data-op="invert">Инверсия</button>
        <button data-op="left">←</button><button data-op="right">→</button>
        <button data-op="up">↑</button><button data-op="down">↓</button>
        <button data-op="flip">Отразить</button>
        <button data-op="rotate">Повернуть 90°</button>
        <button data-op="clear">Очистить</button>
        <label class="file">Импорт картинки<input id="pic-import" type="file" accept="image/png,image/svg+xml"></label>
        <canvas id="pic-preview" width="102" height="22"></canvas>
        <p id="pic-used" class="hint"></p>
      </div>
    </div>
  </section>

  <!-- Settings -->
  <section id="tab-settings" class="tab" hidden>
    <form id="settings-form" class="settings">
      <fieldset><legend>Wi-Fi</legend>
        <label>Сеть <input name="wifi.ssid" list="ssid-list" autocomplete="off"></label>
        <datalist id="ssid-list"></datalist>
        <label>Пароль <input name="wifi.psk" type="password" placeholder="не менять"></label>
        <button type="button" id="btn-scan">Обновить список сетей</button>
      </fieldset>
      <fieldset><legend>MQTT</legend>
        <label>Брокер <input name="mqtt.host"></label>
        <label>Порт <input name="mqtt.port" type="number" min="1" max="65535"></label>
        <label>Пользователь <input name="mqtt.user"></label>
        <label>Пароль <input name="mqtt.pass" type="password" placeholder="не менять"></label>
      </fieldset>
      <fieldset><legend>Время</legend>
        <label>NTP-сервер 1 <input name="ntp.server1"></label>
        <label>NTP-сервер 2 <input name="ntp.server2"></label>
        <label>Интервал, мин <input name="ntp.interval" type="number" min="5" max="1440"></label>
        <label>Часовой пояс (POSIX TZ) <input name="ntp.tz"></label>
        <label>Широта <input name="geo.lat" type="number" step="0.0001"></label>
        <label>Долгота <input name="geo.lon" type="number" step="0.0001"></label>
      </fieldset>
      <fieldset><legend>METAR</legend>
        <label>Станция ICAO <input name="metar.icao" size="4" maxlength="4"></label>
        <label>Основной URL <input name="metar.url1" size="60"></label>
        <label>Запасной URL <input name="metar.url2" size="60"></label>
        <label>Период, мин <input name="metar.period" type="number" min="10" max="180"></label>
        <label>Корневой сертификат (PEM, пусто — встроенный) <textarea name="metar.ca" rows="3"></textarea></label>
      </fieldset>
      <fieldset><legend>Устройство</legend>
        <label>Пользователь веб-страницы <input name="web.user"></label>
        <label>Новый пароль <input name="web.password" type="password" autocomplete="new-password"></label>
        <label>Подсветка после включения
          <select name="lamp.restore"><option value="off">выключена</option><option value="on">включена</option><option value="last">как была</option></select></label>
        <label>Поправка температуры, 0.1 °C <input name="sensor.t_offset" type="number" min="-100" max="100"></label>
        <label>Поправка влажности, 0.1 % <input name="sensor.rh_offset" type="number" min="-200" max="200"></label>
      </fieldset>
      <button class="primary" type="submit">Сохранить настройки</button>
      <fieldset><legend>Обновление прошивки</legend>
        <label class="file">Файл образа (подписанный)<input id="ota-file" type="file" accept=".bin"></label>
        <progress id="ota-progress" max="100" value="0" hidden></progress>
      </fieldset>
    </form>
  </section>

  <!-- Status -->
  <section id="tab-status" class="tab" hidden>
    <dl id="status-list" class="kv"></dl>
    <div class="toolbar"><button id="lamp-toggle">Подсветка</button></div>
    <table id="vars-table" class="vars"><thead><tr><th>Переменная</th><th>Значение</th><th>Источник</th><th>Возраст, с</th></tr></thead><tbody></tbody></table>
  </section>
</main>

<script src="/render.js"></script>
<script src="/app.js"></script>
</body>
</html>
