# MCUmgr (SMP) over UDP port 1337 for development: smpmgr / mcumgr upload,
# reset, echo. Not authenticated, so not in the release build:
#   west build -b native_sim/native/64 fw -- -DEXTRA_CONF_FILE=overlay-smp.conf
# fw/scripts/build-native.sh always adds it (integration tests use smpmgr).
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_CRC=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_TRANSPORT_UDP=y
CONFIG_MCUMGR_TRANSPORT_UDP_IPV4=y
CONFIG_MCUMGR_TRANSPORT_UDP_AUTOMATIC_INIT=n
CONFIG_MCUMGR_TRANSPORT_UDP_STACK_SIZE=4096
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=1536
