# MCUmgr (SMP) over UDP port 1337 for development: echo, reset, task stats.
# Not authenticated, so not in the release build:
#   west build -b native_sim/native/64 fw -- -DEXTRA_CONF_FILE=overlay-smp.conf
# fw/scripts/build-native.sh always adds it (integration tests use smpclient).
# Image upload needs the image group, which needs CONFIG_FLASH_LOAD_OFFSET
# (a board with a bootloader): add overlay-smp-img.conf on the ESP32-S3:
#   west build -b esp32s3_devkitc/esp32s3/procpu --sysbuild fw -- \
#     -DEXTRA_CONF_FILE="overlay-smp.conf;overlay-smp-img.conf"
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_CRC=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_TRANSPORT_UDP=y
CONFIG_MCUMGR_TRANSPORT_UDP_IPV4=y
CONFIG_MCUMGR_TRANSPORT_UDP_AUTOMATIC_INIT=n
CONFIG_MCUMGR_TRANSPORT_UDP_STACK_SIZE=4096
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=1536
# UDP keeps the peer address in the buffer user data (>= sizeof(struct sockaddr): 112 on native_sim)
CONFIG_MCUMGR_TRANSPORT_NETBUF_USER_DATA_SIZE=128
