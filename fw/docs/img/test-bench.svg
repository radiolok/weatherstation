<path d="M460 322V302" fill="none" stroke="#b2431a" stroke-width="2.2"/>
<text x="468" y="316" text-anchor="start" font-size="11" font-weight="400" fill="#b2431a">5 В</text>
<path d="M230 362V412H608V270" fill="none" stroke="#b2431a" stroke-width="2.2"/>
<rect x="700" y="206" width="236" height="72" rx="7" fill="#fafbf7" stroke="#1c2019" stroke-width="1.2"/>
