<path d="M362 222H378" fill="none" stroke="#1f5bb8" stroke-width="1.6" marker-end="url(#s)"/>
<path d="M362 282H378" fill="none" stroke="#1f5bb8" stroke-width="1.6" marker-end="url(#s)"/>
