<path d="M194 90H460V128" fill="none" stroke="#1f5bb8" stroke-width="1.6" marker-end="url(#s)"/>
<text x="204" y="108" text-anchor="start" font-size="11" font-weight="400" fill="#1f5bb8">USB: консоль, JTAG, прошивка</text>
<path d="M194 362H230V347H378" fill="none" stroke="#b2431a" stroke-width="2.2"/>
