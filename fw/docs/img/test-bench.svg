<text x="818.0" y="247" text-anchor="middle" font-size="11.5" fill="#5b6454">лампа табло или</text>
<text x="818.0" y="263" text-anchor="middle" font-size="11.5" fill="#5b6454">16 Ом / 50 Вт на радиаторе</text>
