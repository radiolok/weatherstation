<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-label="Стенд A: плата на макетке, ПК видит консоль, линию RS-485 и логический анализатор" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1c2019"/></marker>
<marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f5bb8"/></marker>
</defs>
<rect width="960" height="470" fill="#ffffff"/>
<text x="24" y="30" font-size="15" font-weight="600" fill="#1c2019">Стенд A: плата на макетке, ПК видит консоль, линию RS-485 и логический анализатор</text>
