<text x="608.0" y="240" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1c2019">Ключ</text>
<text x="608.0" y="257" text-anchor="middle" font-size="11.5" fill="#5b6454">GPIO10</text>
<rect x="380" y="322" width="160" height="50" rx="7" fill="#fafbf7" stroke="#1c2019" stroke-width="1.2"/>
<text x="460.0" y="346" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1c2019">Buck 24 → 5 В</text>
