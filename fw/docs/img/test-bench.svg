<text x="818.0" y="84" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1c2019">USB-RS485</text>
<text x="818.0" y="101" text-anchor="middle" font-size="11.5" fill="#5b6454">снифер кадров табло</text>
<text x="818.0" y="117" text-anchor="middle" font-size="11.5" fill="#5b6454">(стенд B: табло Mobitec)</text>
<path d="M656 162H678V92H698" fill="none" stroke="#1f5bb8" stroke-width="1.6" marker-end="url(#s)"/>
<text x="684" y="140" text-anchor="start" font-size="11" font-weight="400" fill="#1f5bb8">A/B</text>
<path d="M818 60V44H109V58" fill="none" stroke="#1f5bb8" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#s)"/>
<text x="826" y="54" text-anchor="start" font-size="11" font-weight="400" fill="#1f5bb8">USB</text>
<rect x="700" y="300" width="236" height="72" rx="7" fill="none" stroke="#5b6454" stroke-width="1" stroke-dasharray="4 3"/>
<text x="818.0" y="324" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1c2019">Измерения</text>
<text x="818.0" y="341" text-anchor="middle" font-size="11.5" fill="#5b6454">логический анализатор,</text>
<text x="818.0" y="357" text-anchor="middle" font-size="11.5" fill="#5b6454">осциллограф, токовые клещи</text>
<path d="M698 336H672" fill="none" stroke="#5b6454" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#a)"/>
<text x="480" y="440" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5b6454">Сеть: роутер с тестовой SSID, Mosquitto и Home Assistant на сервере, телефон для точки доступа</text>
<text x="480" y="458" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5b6454">Стенд B — то же, но вместо снифера настоящее табло Mobitec с блоком 24 В / 60 Вт</text>
