<text x="679.0" y="202" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1c2019">F8 · Веб и конструктор</text>
<text x="679.0" y="219" text-anchor="middle" font-size="11.5" fill="#5b6454">REST, Playwright</text>
<rect x="600" y="330" width="158" height="58" rx="7" fill="#fafbf7" stroke="#1c2019" stroke-width="1.2"/>
<text x="679.0" y="354" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1c2019">F10 · OTA, надёжность</text>
<text x="679.0" y="371" text-anchor="middle" font-size="11.5" fill="#5b6454">флеш-симулятор, wdt</text>
