<text x="24" y="30" font-size="15" font-weight="600" fill="#1c2019">Фазы F0–F10 проверяются в CI, железо нужно только на стенде после F11</text>
<rect x="24" y="180" width="158" height="58" rx="7" fill="#f6e9a8" stroke="#8a6a00" stroke-width="1.8"/>
