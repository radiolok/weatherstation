# Sysbuild: MCUboot + application (ESP32-S3).
SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_MCUBOOT_MODE_SWAP_USING_MOVE=y
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
# Development key, see fw/keys/README.md. Release builds pass their own key:
#   west build ... -- -DSB_CONFIG_BOOT_SIGNATURE_KEY_FILE=\"/secure/path/key.pem\"
SB_CONFIG_BOOT_SIGNATURE_KEY_FILE="\${APP_DIR}/keys/dev-ecdsa-p256-TEST-ONLY.pem"
