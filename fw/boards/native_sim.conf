# native_sim: console on stdin/stdout so tests can drive the shell
CONFIG_UART_NATIVE_PTY_0_ON_STDINOUT=y
CONFIG_SHELL_VT100_COLORS=n
# Emulators behind the device aliases
CONFIG_EMUL=y
# Host sockets instead of a network driver (NSOS)
CONFIG_NET_DRIVERS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y
CONFIG_ETH_NATIVE_TAP=n

# Commands of the tests are long (forecast JSON): room for a whole line
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=1024

# sys_reboot() restarts zephyr.exe (OTA, watchdog and self-test tests)
CONFIG_NATIVE_SIM_REBOOT=y

# Log lines in order with the shell output and none dropped (tests read them)
CONFIG_LOG_MODE_IMMEDIATE=y

# No internet time in tests (see Kconfig WS_NTP_DEFAULT_SERVER)
CONFIG_WS_NTP_DEFAULT_SERVER=""
