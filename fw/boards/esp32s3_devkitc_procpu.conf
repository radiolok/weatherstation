# ESP32-S3-DevKitC-1U N16R8
CONFIG_ESP_SPIRAM=y
CONFIG_SPIRAM_MODE_OCT=y

# Wi-Fi: station and access point (setup page at 192.168.4.1)
CONFIG_WIFI=y
CONFIG_WIFI_USAGE_MODE_STA_AP=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_DHCPV4_SERVER=y
CONFIG_NET_IF_MAX_IPV4_COUNT=2
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=64
CONFIG_DNS_RESOLVER=y
# weatherstation.local
CONFIG_MDNS_RESPONDER=y
CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME="weatherstation"

# Internal DRAM is short: the mbedTLS heap and Wi-Fi/network buffers go to
# PSRAM, like the large application buffers (WS_BIG_BSS in src/app.h)
CONFIG_MBEDTLS_HEAP_CUSTOM_SECTION=y
CONFIG_ESP32_WIFI_NET_ALLOC_SPIRAM=y

# Hardware watchdog as the fallback of the task watchdog (src/wdt)
CONFIG_WATCHDOG=y
